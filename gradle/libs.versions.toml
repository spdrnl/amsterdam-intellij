[versions]
# libraries
antlr = "4.13.2"
antlr4-intellij-adaptor = "0.1-SNAPSHOT"
junit = "4.13.2"
opentest4j = "1.3.0"

# plugins
antlr-plugin = "5.0.0"
changelog = "2.5.0"
intelliJPlatform = "2.10.5"
kotlin = "2.2.21"
kover = "0.9.3"
qodana = "2025.2.2"

[libraries]
antlr4 = { group = "org.antlr", name = "antlr4", version.ref = "antlr" }
antlr4-runtime = { group = "org.antlr", name = "antlr4-runtime", version.ref = "antlr" }
antlr4-intellij-adaptor = { group = "org.antlr", name = "antlr4-intellij-adaptor", version.ref = "antlr4-intellij-adaptor" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }

[plugins]
antlr = { id = "org.antlr.antlr4", version.ref = "antlr-plugin" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
